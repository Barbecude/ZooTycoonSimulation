plugins {
    id 'fabric-loom' version '1.7.4'
    id 'maven-publish'
}

version = project.mod_version
group = project.mod_group

base {
    archivesName = project.mod_id
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

dependencies {
    // Minecraft 1.21.1 & Official Mojang Mappings
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    // Fabric Loader & Fabric API
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE.txt") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// Copy mod jar to Modrinth profile after build
def modrinthModsPath = "C:\\Users\\Zevaldo\\AppData\\Roaming\\ModrinthApp\\profiles\\Fresh & Smooth\\mods"

tasks.register('copyToModrinth') {
    doLast {
        def modrinthDir = file(modrinthModsPath)
        if (!modrinthDir.exists()) {
            modrinthDir.mkdirs()
            println "Created mods directory: ${modrinthModsPath}"
        }

        def remapJarTask = tasks.findByName('remapJar')
        def jarFile = remapJarTask != null ? remapJarTask.archiveFile.get().asFile : tasks.named('jar').get().archiveFile.get().asFile
        def destFile = new File(modrinthDir, jarFile.name)
        copy {
            from jarFile
            into modrinthDir
        }
        println "✓ Copied mod to Modrinth: ${destFile.name}"
    }
}

tasks.named('build').configure {
    finalizedBy 'copyToModrinth'
}
